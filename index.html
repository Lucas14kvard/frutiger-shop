<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Frutiger Aero</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="bg-bubbles">
        <div class="bubble"></div>
        <div class="bubble"></div>
        <div class="bubble"></div>
        <div class="bubble"></div>
        <div class="bubble"></div>
        <div class="bubble"></div>
    </div>

    <div class="container">
        <header>
            <h1>✨ Frutiger Aero ✨</h1>
            <p class="subtitle">~ вещи в стиле Y2K ~</p>
        </header>

        <div class="products-grid" id="productsGrid">
            <div class="loading">Загрузка товаров...</div>
        </div>
    </div>

    <!-- Модалка с деталями товара -->
    <div class="modal-overlay" id="productModal">
        <div class="modal-content">
            <button class="modal-close" onclick="closeModal()">✕</button>
            
            <div class="gallery-container">
                <div class="gallery-slider" id="gallerySlider"></div>
                <button class="gallery-nav prev" onclick="slideGallery(-1)">‹</button>
                <button class="gallery-nav next" onclick="slideGallery(1)">›</button>
                <div class="gallery-dots" id="galleryDots"></div>
            </div>

            <div class="product-info">
                <h2 id="modalTitle"></h2>
                <p class="product-price" id="modalPrice"></p>
                <p class="product-desc" id="modalDesc"></p>
                
                <button class="btn-order" onclick="openOrderModal()">
                    💫 Заказать
                </button>
            </div>
        </div>
    </div>

    <!-- Модалка "Заказать" с соцсетями -->
    <div class="modal-overlay" id="orderModal">
        <div class="modal-content order-modal">
            <button class="modal-close" onclick="closeOrderModal()">✕</button>
            <h2>📩 Свяжитесь со мной</h2>
            <p>Выберите удобный способ:</p>
            <div class="social-links">
                <a href="https://t.me/ТВОЙ_ТЕЛЕГРАМ" target="_blank" class="social-btn telegram">
                    <span class="social-icon">✈️</span> Telegram
                </a>
                <a href="https://wa.me/ТВОЙ_НОМЕР" target="_blank" class="social-btn whatsapp">
                    <span class="social-icon">💬</span> WhatsApp
                </a>
                <a href="https://vk.com/ТВОЙ_ВК" target="_blank" class="social-btn vk">
                    <span class="social-icon">📘</span> ВКонтакте
                </a>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
