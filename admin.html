<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Админка</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="bg-bubbles">
        <div class="bubble"></div>
        <div class="bubble"></div>
        <div class="bubble"></div>
    </div>

    <div class="container">
        <div id="loginScreen">
            <h1>🔐 Вход в админку</h1>
            <input type="password" id="passwordInput" placeholder="Пароль" class="input-field">
            <button onclick="login()" class="btn-submit">Войти</button>
            <p id="loginError" style="color: #ff6b6b; display: none;">Неверный пароль</p>
        </div>

        <div id="adminScreen" style="display: none;">
            <h1>✨ Добавить товар</h1>
            
            <div class="form-group">
                <label>Название товара</label>
                <input type="text" id="productName" class="input-field" placeholder="Например: Стеклянный шар">
            </div>

            <div class="form-group">
                <label>Цена</label>
                <input type="text" id="productPrice" class="input-field" placeholder="Например: 1 500 ₽">
            </div>

            <div class="form-group">
                <label>Описание</label>
                <textarea id="productDesc" class="input-field" rows="4" placeholder="Опиши товар..."></textarea>
            </div>

            <div class="form-group">
                <label>Фотографии (можно выбрать несколько)</label>
                <input type="file" id="productPhotos" accept="image/*" multiple class="input-field">
                <div id="photoPreview" class="photo-preview"></div>
            </div>

            <button onclick="saveProduct()" class="btn-submit">💾 Сохранить товар</button>
            <p id="saveStatus"></p>

            <hr style="margin: 30px 0; border-color: rgba(255,255,255,0.2);">
            <button onclick="logout()" class="btn-logout">🚪 Выйти</button>
        </div>
    </div>

    <script src="admin.js"></script>
</body>
</html>
